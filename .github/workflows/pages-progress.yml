name: Pages progress

on:
  push:
    branches: [main]
    paths:
      - core/libs/prx/**
      - core/shader/recompiler/RdnaDecoder/include/RdnaDecoder/RdnaOpcode.hpp

permissions:
  contents: read
  actions: write
  pages: read

concurrency:
  group: pages-progress
  cancel-in-progress: true

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy Pages if the progress changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 tools/progress.py "$RUNNER_TEMP/progress"
          set +e
          site=$(gh api "repos/$GH_REPO/pages" --jq .html_url 2>"$RUNNER_TEMP/pages-api-stderr")
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -q "HTTP 404" "$RUNNER_TEMP/pages-api-stderr"; then
              echo "GitHub Pages is not configured, progress deployment skipped" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat "$RUNNER_TEMP/pages-api-stderr" >&2
            exit $status
          fi
          if curl -fsSL "${site%/}/progress.json?$GITHUB_SHA" -o "$RUNNER_TEMP/deployed.json" &&
            cmp -s "$RUNNER_TEMP/deployed.json" "$RUNNER_TEMP/progress/progress.json"; then
            echo "Progress unchanged, Pages not deployed" >> "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run pages.yml --ref main
            echo "Progress changed, Pages deployment dispatched" >> "$GITHUB_STEP_SUMMARY"
          fi
